<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Reflow profile as a process window</title>
  <desc id="desc">An original line graph showing a thermal process window, high and low board-temperature traces, and checks for peak temperature and time above liquidus.</desc>
  <rect width="1200" height="675" fill="#f6fafc"/>
  <text x="65" y="75" fill="#123d55" font-family="Arial, sans-serif" font-size="39" font-weight="700">Treat the profile as a process window, not a single peak</text>
  <text x="65" y="116" fill="#527082" font-family="Arial, sans-serif" font-size="22">The product is acceptable only when every critical point stays inside its approved limits.</text>
  <g transform="translate(130 168)">
    <rect x="0" y="0" width="935" height="362" rx="12" fill="#fff" stroke="#d5e3ea" stroke-width="2"/>
    <rect x="0" y="88" width="935" height="97" fill="#e8faf0"/><rect x="0" y="20" width="935" height="68" fill="#fff4e2"/><text x="19" y="52" fill="#936000" font-family="Arial, sans-serif" font-size="19">Do not exceed component/package limit</text><text x="19" y="146" fill="#19815e" font-family="Arial, sans-serif" font-size="19">Approved reflow envelope</text>
    <path d="M80 315H870M80 315V28" stroke="#5a7686" stroke-width="3"/><path d="M80 165H870" stroke="#19815e" stroke-width="3" stroke-dasharray="9 8"/><text x="10" y="171" fill="#19815e" font-family="Arial, sans-serif" font-size="19">Liquidus</text>
    <path d="M96 306 C178 286 228 238 300 185 S425 148 493 129 S620 77 678 67 S744 91 840 274" fill="none" stroke="#0b9c8e" stroke-width="11" stroke-linecap="round"/>
    <path d="M96 306 C193 290 254 245 326 212 S450 169 520 151 S651 104 720 97 S790 121 840 286" fill="none" stroke="#3287bf" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 10"/>
    <path d="M505 165V315M752 165V315" stroke="#e5ac24" stroke-width="3" stroke-dasharray="7 7"/><path d="M505 274H752" stroke="#e5ac24" stroke-width="5"/><path d="M505 274l16 -9v18zM752 274l-16 -9v18z" fill="#e5ac24"/><text x="579" y="259" fill="#9a6500" font-family="Arial, sans-serif" font-size="20">Time above liquidus</text>
    <circle cx="678" cy="67" r="8" fill="#0b9c8e"/><path d="M678 67L740 28" stroke="#0b9c8e" stroke-width="3"/><text x="748" y="34" fill="#0b7469" font-family="Arial, sans-serif" font-size="20">Peak check</text>
    <text x="96" y="348" fill="#527082" font-family="Arial, sans-serif" font-size="19">Preheat</text><text x="328" y="348" fill="#527082" font-family="Arial, sans-serif" font-size="19">Activation / equalisation</text><text x="681" y="348" fill="#527082" font-family="Arial, sans-serif" font-size="19">Cool</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="21"><rect x="135" y="570" width="26" height="7" rx="3" fill="#0b9c8e"/><text x="174" y="579" fill="#28495b">Fast-heating location</text><path d="M455 574h30" stroke="#3287bf" stroke-width="7" stroke-dasharray="11 8"/><text x="500" y="579" fill="#28495b">Slow-heating location</text><text x="65" y="635" fill="#527082">Use approved component and solder-paste limits to define the window; oven setpoints are only the control inputs.</text></g>
</svg>
