<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Product-level reflow profiling</title>
  <desc id="desc">An original technical illustration of a PCB travelling through a reflow oven with a controlled temperature profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset="1" stop-color="#123d55"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#56d7c1"/></linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#56d7c1"/><stop offset=".65" stop-color="#f6c55c"/><stop offset="1" stop-color="#ff7b6b"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".15" stroke="#bfe9f2"><path d="M0 120H1600M0 260H1600M0 400H1600M0 540H1600M0 680H1600M160 0V900M400 0V900M640 0V900M880 0V900M1120 0V900M1360 0V900"/></g>
  <text x="114" y="155" fill="#8ce5d3" font-family="Arial, sans-serif" font-size="30" letter-spacing="5">SMT PROCESS CONTROL</text>
  <text x="110" y="245" fill="#fff" font-family="Arial, sans-serif" font-size="76" font-weight="700">Product-Level</text>
  <text x="110" y="332" fill="#fff" font-family="Arial, sans-serif" font-size="76" font-weight="700">Reflow Profiling</text>
  <text x="114" y="390" fill="#c1d7e5" font-family="Arial, sans-serif" font-size="29">Measure the assembly — not just the oven setpoints.</text>
  <g transform="translate(108 505)">
    <rect x="0" y="130" width="550" height="108" rx="12" fill="url(#board)"/>
    <rect x="52" y="158" width="72" height="51" rx="4" fill="#dff8f1"/><rect x="152" y="151" width="96" height="64" rx="5" fill="#dff8f1"/>
    <rect x="285" y="148" width="131" height="71" rx="7" fill="#dff8f1"/><circle cx="354" cy="183" r="19" fill="#198c77"/>
    <rect x="455" y="156" width="55" height="55" rx="4" fill="#dff8f1"/>
    <path d="M22 258H540" stroke="#85a9bd" stroke-width="8" stroke-linecap="round"/><circle cx="86" cy="258" r="13" fill="#f6c55c"/><circle cx="270" cy="258" r="13" fill="#f6c55c"/><circle cx="454" cy="258" r="13" fill="#f6c55c"/>
    <path d="M78 131V44M350 131V10M482 131V66" stroke="#ffdb83" stroke-width="4" stroke-dasharray="8 8"/>
    <circle cx="78" cy="44" r="8" fill="#ffdb83"/><circle cx="350" cy="10" r="8" fill="#ffdb83"/><circle cx="482" cy="66" r="8" fill="#ffdb83"/>
    <text x="0" y="310" fill="#b9d3df" font-family="Arial, sans-serif" font-size="23">Thermocouples at critical thermal locations</text>
  </g>
  <g transform="translate(790 160)">
    <text x="0" y="0" fill="#b9d3df" font-family="Arial, sans-serif" font-size="24">BOARD TEMPERATURE vs. TIME</text>
    <path d="M0 580H670M0 580V54" stroke="#b9d3df" stroke-width="3"/>
    <path d="M0 430H670M0 285H670M0 140H670" stroke="#b9d3df" stroke-width="2" stroke-dasharray="8 10" opacity=".42"/>
    <text x="-42" y="586" fill="#b9d3df" font-family="Arial, sans-serif" font-size="20">25°</text><text x="-48" y="435" fill="#b9d3df" font-family="Arial, sans-serif" font-size="20">150°</text><text x="-48" y="290" fill="#b9d3df" font-family="Arial, sans-serif" font-size="20">217°</text><text x="-48" y="145" fill="#b9d3df" font-family="Arial, sans-serif" font-size="20">245°</text>
    <path d="M12 570 C70 540 105 475 172 404 S280 320 352 275 S441 179 505 136 S591 157 658 373" fill="none" stroke="url(#line)" stroke-width="13" stroke-linecap="round"/>
    <path d="M12 570 C94 552 160 496 225 433 S345 356 414 317 S527 215 575 183 S624 205 658 408" fill="none" stroke="#85dcff" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12" opacity=".95"/>
    <rect x="423" y="247" width="153" height="42" rx="21" fill="#1e596f"/><text x="447" y="276" fill="#fff" font-family="Arial, sans-serif" font-size="18">TAL window</text>
    <text x="22" y="632" fill="#b9d3df" font-family="Arial, sans-serif" font-size="21">Preheat</text><text x="235" y="632" fill="#b9d3df" font-family="Arial, sans-serif" font-size="21">Equalise</text><text x="457" y="632" fill="#b9d3df" font-family="Arial, sans-serif" font-size="21">Reflow / cool</text>
  </g>
  <text x="111" y="833" fill="#8eb6c6" font-family="Arial, sans-serif" font-size="20">Original technical illustration • Light</text>
</svg>
