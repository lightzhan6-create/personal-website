<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->

    <title>图库 - <!-- SITE_TITLE --></title>

    <!-- GALLERY_SEO_HEAD -->

    <style>
        #gallery-grid.gallery-album-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        #gallery-grid.gallery-photo-grid {
            column-count: 1;
            column-gap: 1rem;
        }

        .gallery-album-card {
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .gallery-album-card:hover {
            transform: translateY(-3px);
            border-color: #cbd5e1;
            box-shadow: 0 18px 45px rgb(15 23 42 / 8%);
        }

        .gallery-album-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .gallery-album-cover {
            position: relative;
            overflow: hidden;
            background: #e2e8f0;
        }

        .gallery-album-cover img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            transition: transform 220ms ease;
        }

        .gallery-album-card:hover .gallery-album-cover img {
            transform: scale(1.025);
        }

        .gallery-album-count {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            border-radius: 999px;
            background: rgb(15 23 42 / 72%);
            padding: 0.35rem 0.65rem;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .gallery-album-body {
            display: grid;
            gap: 0.55rem;
            padding: 1.05rem;
        }

        .gallery-album-body h2 {
            margin: 0;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 650;
            line-height: 1.45;
        }

        .gallery-album-body time {
            color: #94a3b8;
            font-size: 0.78rem;
        }

        .gallery-album-body p {
            margin: 0;
            color: #64748b;
            font-size: 0.88rem;
            line-height: 1.7;
        }

        .gallery-photo {
            display: inline-block;
            width: 100%;
            margin: 0 0 1rem;
            break-inside: avoid;
            border-radius: 8px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .gallery-photo-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            cursor: zoom-in;
            overflow: hidden;
        }

        .gallery-photo img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: var(--gallery-photo-ratio, auto);
            transition: transform 220ms ease;
        }

        .gallery-photo-button:hover img {
            transform: scale(1.025);
        }

        .gallery-photo-caption {
            display: grid;
            gap: 0.35rem;
            padding: 0.85rem 0.95rem 1rem;
            background: #ffffff;
            color: #64748b;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .gallery-photo-caption strong {
            color: #0f172a;
            font-size: 0.98rem;
            font-weight: 600;
        }

        .gallery-photo-caption time {
            color: #94a3b8;
            font-size: 0.78rem;
        }

        .gallery-lightbox {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 1rem;
            padding: 1rem;
            background: rgb(2 6 23 / 92%);
            color: white;
        }

        html.freecat-modal-open,
        html.freecat-modal-open body {
            overflow: hidden;
        }

        .gallery-lightbox[hidden] {
            display: none;
        }

        .gallery-lightbox-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .gallery-lightbox-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 999px;
            background: rgb(255 255 255 / 8%);
            color: #ffffff;
            transition: background-color 160ms ease;
        }

        .gallery-lightbox-button:hover {
            background: rgb(255 255 255 / 16%);
        }

        .gallery-lightbox-stage {
            position: relative;
            display: flex;
            min-height: 0;
            align-items: center;
            justify-content: center;
        }

        .gallery-lightbox-image {
            max-width: 100%;
            max-height: 78vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .gallery-lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .gallery-lightbox-prev {
            left: 0;
        }

        .gallery-lightbox-next {
            right: 0;
        }

        .gallery-lightbox-caption {
            display: grid;
            gap: 0.35rem;
            max-width: 760px;
            margin-inline: auto;
            text-align: center;
            color: rgb(226 232 240 / 88%);
            line-height: 1.7;
        }

        .gallery-lightbox-caption strong {
            color: #ffffff;
            font-size: 1.05rem;
        }

        .gallery-lightbox-caption time {
            color: rgb(203 213 225 / 72%);
            font-size: 0.85rem;
        }

        .dark .gallery-photo {
            background: #1e293b;
        }

        .dark .gallery-album-card {
            border-color: #1e293b;
            background: #0f172a;
        }

        .dark .gallery-album-card:hover {
            border-color: #475569;
            box-shadow: 0 18px 45px rgb(0 0 0 / 25%);
        }

        .dark .gallery-album-cover {
            background: #1e293b;
        }

        .dark .gallery-album-body h2 {
            color: #ffffff;
        }

        .dark .gallery-album-body p {
            color: #cbd5e1;
        }

        .dark .gallery-photo-caption {
            background: #0f172a;
            color: #cbd5e1;
        }

        .dark .gallery-photo-caption strong {
            color: #ffffff;
        }

        @media (min-width: 560px) {
            #gallery-grid.gallery-album-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            #gallery-grid.gallery-photo-grid {
                column-count: 2;
            }
        }

        @media (min-width: 960px) {
            #gallery-grid.gallery-album-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            #gallery-grid.gallery-photo-grid {
                column-count: 3;
                column-gap: 1.1rem;
            }

            .gallery-photo {
                margin-bottom: 1.1rem;
            }
        }

        @media (min-width: 1360px) {
            #gallery-grid.gallery-album-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            #gallery-grid.gallery-photo-grid {
                column-count: 4;
            }
        }

        @media (max-width: 640px) {
            .gallery-lightbox {
                padding: 0.75rem;
            }

            .gallery-lightbox-nav {
                position: static;
                transform: none;
            }

            .gallery-lightbox-bar {
                order: 1;
            }

            .gallery-lightbox-stage {
                order: 2;
            }

            .gallery-lightbox-caption {
                order: 3;
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gallery-album-card,
            .gallery-album-cover img,
            .gallery-photo img,
            .gallery-lightbox-button {
                transition: none !important;
            }
        }
    </style>
</head>

<body
    class="bg-background-light font-display text-[#1e293b] transition-colors duration-200 dark:bg-background-dark dark:text-slate-200"
>
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

        <!-- INCLUDE:header -->

        <main
            class="page-blur-target mt-[var(--freecat-page-top-offset)] grow px-5 pb-20 pt-10 sm:px-8 md:px-16 lg:px-28"
        >
            <div class="mx-auto w-full max-w-[1500px]">
                <!-- GALLERY_BACK_LINK -->

                <section class="mb-10 text-center md:mb-14">
                    <p
                        class="mb-3 text-sm font-medium uppercase tracking-[0.22em] text-primary"
                    >
                        <!-- GALLERY_PAGE_LABEL -->
                    </p>

                    <h1
                        class="mb-5 text-4xl font-bold tracking-tight text-slate-900 dark:text-white md:text-5xl"
                    >
                        <!-- GALLERY_PAGE_TITLE -->
                    </h1>

                    <!-- GALLERY_PAGE_DESCRIPTION -->
                </section>

                <!-- GALLERY_ALBUM_INTRO -->

                <section
                    id="gallery-grid"
                    class="<!-- GALLERY_GRID_CLASS -->"
                    aria-label="图片列表"
                    data-i18n-attr="aria-label:gallery.listAria"
                >
                    <!-- GALLERY_ITEMS -->
                </section>

                <!-- GALLERY_EMPTY_STATE -->

            </div>
        </main>

        <!-- INCLUDE:footer-no-social -->
    </div>

    <div
        id="gallery-lightbox"
        class="gallery-lightbox"
        hidden
        role="dialog"
        aria-modal="true"
        aria-label="图片预览"
    >
        <div class="gallery-lightbox-bar">
            <div class="text-sm text-slate-300">
                <span id="gallery-lightbox-count"></span>
            </div>

            <button
                type="button"
                class="gallery-lightbox-button"
                data-gallery-close
                aria-label="关闭大图"
            >
                ×
            </button>
        </div>

        <div class="gallery-lightbox-stage">
            <button
                type="button"
                class="gallery-lightbox-button gallery-lightbox-nav gallery-lightbox-prev"
                data-gallery-prev
                aria-label="上一张"
            >
                ‹
            </button>

            <img
                id="gallery-lightbox-image"
                class="gallery-lightbox-image"
                alt=""
            >

            <button
                type="button"
                class="gallery-lightbox-button gallery-lightbox-nav gallery-lightbox-next"
                data-gallery-next
                aria-label="下一张"
            >
                ›
            </button>
        </div>

        <div class="gallery-lightbox-caption">
            <strong id="gallery-lightbox-title"></strong>
            <time id="gallery-lightbox-date"></time>
            <span id="gallery-lightbox-description"></span>
        </div>
    </div>

    <script type="application/json" id="gallery-lightbox-data"><!-- GALLERY_LIGHTBOX_DATA --></script>

    <!-- INCLUDE:scripts-end -->

    <script>
        (() => {
            const dataEl = document.getElementById("gallery-lightbox-data");
            const dialog = document.getElementById("gallery-lightbox");
            const image = document.getElementById("gallery-lightbox-image");
            const title = document.getElementById("gallery-lightbox-title");
            const date = document.getElementById("gallery-lightbox-date");
            const description = document.getElementById("gallery-lightbox-description");
            const count = document.getElementById("gallery-lightbox-count");
            const closeButtons = Array.from(document.querySelectorAll("[data-gallery-close]"));
            const prevButtons = Array.from(document.querySelectorAll("[data-gallery-prev]"));
            const nextButtons = Array.from(document.querySelectorAll("[data-gallery-next]"));
            const triggers = Array.from(document.querySelectorAll("[data-gallery-index]"));

            let photos = [];
            let currentIndex = 0;

            try {
                photos = JSON.parse(dataEl.textContent || "[]");
            } catch (error) {
                photos = [];
            }

            function setText(el, value) {
                el.textContent = value || "";
                el.hidden = !value;
            }

            function render() {
                const photo = photos[currentIndex];
                if (!photo) return;

                image.src = photo.src;
                image.alt = photo.alt || photo.title || "";
                if (photo.width && photo.height) {
                    image.width = photo.width;
                    image.height = photo.height;
                } else {
                    image.removeAttribute("width");
                    image.removeAttribute("height");
                }

                setText(title, photo.title);
                setText(date, photo.date);
                if (photo.date) date.dateTime = photo.date;
                setText(description, photo.description);
                count.textContent = `${currentIndex + 1} / ${photos.length}`;
            }

            function open(index) {
                if (!photos.length) return;
                currentIndex = Math.max(0, Math.min(Number(index) || 0, photos.length - 1));
                render();
                dialog.hidden = false;
                document.documentElement.classList.add("freecat-modal-open");
                closeButtons[0]?.focus();
            }

            function close() {
                dialog.hidden = true;
                image.removeAttribute("src");
                document.documentElement.classList.remove("freecat-modal-open");
            }

            function move(delta) {
                if (!photos.length) return;
                currentIndex = (currentIndex + delta + photos.length) % photos.length;
                render();
            }

            triggers.forEach((button) => {
                button.addEventListener("click", () => open(button.dataset.galleryIndex));
            });

            closeButtons.forEach((button) => {
                button.addEventListener("click", close);
            });

            prevButtons.forEach((button) => {
                button.addEventListener("click", () => move(-1));
            });

            nextButtons.forEach((button) => {
                button.addEventListener("click", () => move(1));
            });

            dialog.addEventListener("click", (event) => {
                if (event.target === dialog) close();
            });

            document.addEventListener("keydown", (event) => {
                if (dialog.hidden) return;
                if (event.key === "Escape") close();
                if (event.key === "ArrowLeft") move(-1);
                if (event.key === "ArrowRight") move(1);
            });
        })();
    </script>
</body>

</html>
