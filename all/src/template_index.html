<!DOCTYPE html>
<html lang="<!-- SITE_LANGUAGE -->">

<head>
    <!-- INCLUDE:head-base -->
    <title><!-- SITE_TITLE --></title>
    <!-- HOME_SEO_HEAD -->
    <!-- HOME_JSONLD -->

    <!-- INCLUDE:home-layout-style -->
</head>

<body data-page="home"
    class="bg-background-light dark:bg-background-dark font-display text-[#1e293b] dark:text-slate-200 transition-colors duration-200">
    <div class="freecat-home-stage relative flex h-auto min-h-screen w-full flex-col">

        <!-- INCLUDE:header -->

        <!-- 主内容区：freecat-home-hero 标记让 main.js 跳过 layout-container 的 margin-top，
             左/右两块各自承担让位顶栏的 padding-top。 -->
        <div data-floating-nav-container class="layout-container page-blur-target freecat-home-hero flex h-full grow flex-col">
            <div class="freecat-home-layout w-full">

                <!-- INCLUDE:home-sidebar -->

                <!-- 右侧文章列表区：inner 居中于视口，同时避开左侧 sidebar。 -->
                <section class="freecat-home-posts">
                    <div class="freecat-home-posts-inner w-full">
                        <div id="view-all-header"
                            class="flex items-baseline justify-start pb-2 pt-0 mb-5">
                            <!-- PAGINATION_PLACEHOLDER -->
                        </div>
                        <div class="freecat-home-posts-column w-full min-w-0">
                            <section class="home-content-section mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 md:p-6">
                                <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                                    <div class="min-w-0">
                                        <p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-primary">
                                            <span data-i18n="home.latestArticlesLabel">
                                            Latest Articles
                                            </span>
                                        </p>
                                        <h2 class="text-xl font-semibold text-slate-900 dark:text-white" data-i18n="home.latestArticlesTitle">
                                            最新文章
                                        </h2>
                                        <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400" data-i18n="home.latestArticlesDescription">
                                            长文章、行业内容、外贸 B2B 经验、AI 工具和个人成长记录。
                                        </p>
                                    </div>
                                    <a class="home-section-link inline-flex shrink-0 items-center gap-1 text-sm font-semibold text-primary" href="/posts/">
                                        <span data-i18n="home.viewArticles">
                                        View Articles
                                        </span>
                                        <span aria-hidden="true">→</span>
                                    </a>
                                </div>
                            </section>

                            <!-- === 动态文章注入区 === -->
                            <div id="posts-list" class="freecat-post-card-list">
                                <!-- POSTS_LIST_PLACEHOLDER -->
                            </div>
                            <!-- ===================== -->

                            <div class="home-content-sections mt-6 grid gap-6">
                                <!-- HOME_CONTENT_SECTIONS -->
                            </div>
                        </div>
                    </div>

                    <!-- 底部主要分页器：独立于 inner，跨整个视口居中，
                         避免被 sidebar padding-left 推偏，也不受 inner 的 zoom 缩放影响。 -->
                    <div id="pagination-buttons" class="freecat-home-pagination flex justify-center">
                        <!-- PAGINATION_BUTTONS_PLACEHOLDER -->
                    </div>
                </section>

            </div>
        </div>

        <!-- INCLUDE:floating-nav -->

        <!-- INCLUDE:footer -->
    </div>

    <!-- INCLUDE:scripts-end -->
</body>

</html>
